name: Deploy to Vercel

# Requires three GitHub Actions secrets (repo → Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        — create one at https://vercel.com/account/tokens
#   VERCEL_ORG_ID       — from `vercel link` (.vercel/project.json → orgId)
#   VERCEL_PROJECT_ID   — from `vercel link` (.vercel/project.json → projectId)
#
# The Vercel project must also have PUBLIC_SUPABASE_URL and PUBLIC_SUPABASE_KEY set
# for Production (they are inlined at build time), so `vercel pull` provides them.

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy project artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
